[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200

build_flags =
    -I include

lib_deps =
    https://github.com/tzapu/WiFiManager.git
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
